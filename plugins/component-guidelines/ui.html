/* figui3 generated end */
:root{--font-stack:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
--fs-11:11px;--fs-12:12px;--fs-13:13px;--fw-regular:400;--fw-medium:500;
--fw-semibold:600;--lh:16px;--radius-sm:2px;--radius-lg:6px;--space-1:4px;
--space-2:8px;--space-3:16px;--space-4:24px;--control-h:24px;--input-h:24px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden}
.secondary{color:var(--figma-color-text-secondary)}
/* the window: a fig-header holding the fig-tabs, one .panel per tab, each ending in a fig-footer with its action */
.panel{display:flex;flex:1;min-height:0;flex-direction:column}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:var(--spacer-3,12px)}
.panel-body.fields{padding:var(--spacer-2,8px) 0}
fig-footer>.footer-hint{flex:1;min-width:0;align-self:center;color:var(--figma-color-text-secondary);overflow-wrap:anywhere}
/* a link-like action inside a field row, where a fig-button would be too heavy */
.text-btn{flex:none;height:auto;padding:0;border:0;background:none;color:var(--figma-color-text-brand);font:inherit;cursor:default}
.text-btn:hover{text-decoration:underline}
.text-btn:focus{outline:none}
.text-btn:focus-visible{outline:var(--figma-focus-outline,2px solid var(--figma-color-border-selected));outline-offset:2px}
[hidden]{display:none !important}
/* ui-base v4 end */

/* component-guidelines own content: the guideline lists (the frame and the name header are FigUI3's) */
/* sized to its content (the window follows it, up to code.js's cap); scrolls past the cap */
#plugin-root{flex:none;max-height:100%;overflow-y:auto}
.section{padding:var(--spacer-2,8px) var(--spacer-3,12px)}
.section+.section{border-top:1px solid var(--figma-color-border)}
.section-header{display:flex;align-items:center;gap:6px;margin-bottom:var(--space-1)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:100px;
font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.usage .badge{background:var(--figma-color-bg-success-tertiary,var(--figma-color-bg-success,#e6f4ec));
color:var(--figma-color-text-success,#1a7a3e)}
.dont .badge{background:var(--figma-color-bg-danger-tertiary,var(--figma-color-bg-danger,#fde8e6));
color:var(--figma-color-text-danger,#b52b1e)}
.items{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:flex-start;gap:7px;padding:3px 0;line-height:1.55}
.item .dot{flex-shrink:0;width:14px;height:14px;border-radius:50%;margin-top:1px;
display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.usage .dot{background:var(--figma-color-bg-success-tertiary,var(--figma-color-bg-success,#e6f4ec));
color:var(--figma-color-text-success,#1a7a3e)}
.dont .dot{background:var(--figma-color-bg-danger-tertiary,var(--figma-color-bg-danger,#fde8e6));
color:var(--figma-color-text-danger,#b52b1e)}
.empty-state{padding:20px var(--spacer-3,12px);color:var(--figma-color-text-secondary);
text-align:center;line-height:1.6}
