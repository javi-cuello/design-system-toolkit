<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit lite</title>
<style>
/* ui-base v3 start — canonical: plugins/_shared/ui-base.css
   Requires figma.showUI(__html__, { themeColors: true }). Colour from injected
   --figma-color-* tokens only; metrics per Figma-native controls.
   CAUTION for plugins with rich bespoke controls: the rules below use bare
   element selectors (button, input[type=text], select) that apply to EVERY
   matching tag. A bespoke class that doesn't explicitly set height/padding/
   box-sizing will silently inherit this baseline's values instead of its own
   — not broken, but not intentional. When inlining into a plugin with more
   than a couple of custom controls, give each bespoke control an explicit
   height + box-sizing:border-box, even if the value matches what it would
   have inherited anyway. See skill-standard §B 4. */
:root{--font-stack:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
--fs-11:11px;--fs-12:12px;--fs-13:13px;--fw-regular:400;--fw-medium:500;
--fw-semibold:600;--lh:16px;--radius-sm:2px;--radius-lg:6px;--space-1:4px;
--space-2:8px;--space-3:16px;--space-4:24px;--control-h:32px;--input-h:30px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-stack);font-size:var(--fs-11);
line-height:var(--lh);letter-spacing:.005em;color:var(--figma-color-text);
background:var(--figma-color-bg);-webkit-font-smoothing:antialiased}
.container{padding:var(--space-3)}
.section-title{font-weight:var(--fw-semibold)}
.secondary{color:var(--figma-color-text-secondary)}
button,.btn{height:var(--control-h);padding:0 var(--space-3);
border-radius:var(--radius-lg);border:1px solid transparent;
font:var(--fw-medium) var(--fs-11)/1 var(--font-stack);
background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand);cursor:default}
button:hover,.btn:hover{background:var(--figma-color-bg-brand-hover)}
button:disabled{background:var(--figma-color-bg-disabled);color:var(--figma-color-text-ondisabled)}
.btn-secondary{background:var(--figma-color-bg);color:var(--figma-color-text);
border:1px solid var(--figma-color-border-strong)}
/* Without this, `button:hover` above (0-1-1) beats `.btn-secondary` (0-1-0)
   and every secondary button turns brand-blue under the pointer. One plugin
   had already patched that in its own stylesheet, which is the duplication
   this file exists to prevent. */
.btn-secondary:hover{background:var(--figma-color-bg-secondary);color:var(--figma-color-text)}
.btn-secondary:disabled{background:var(--figma-color-bg-disabled);
color:var(--figma-color-text-ondisabled);border-color:transparent}
input[type=text],input[type=number],select,.input{height:var(--input-h);width:100%;
padding:0 var(--space-2);border-radius:var(--radius-sm);
border:1px solid var(--figma-color-border);background:var(--figma-color-bg-secondary);
color:var(--figma-color-text);font:var(--fw-regular) var(--fs-11)/1 var(--font-stack)}
input:focus,select:focus,.input:focus{outline:none;border-color:var(--figma-color-border-selected)}
/* a border colour alone is no focus indicator (WCAG 2.4.7, 1.4.11): the keyboard's focus gets a ring */
input:focus-visible,select:focus-visible,.input:focus-visible{outline:2px solid var(--figma-color-border-selected);outline-offset:1px}
input::placeholder{color:var(--figma-color-text-tertiary)}
.checkbox{display:flex;align-items:center;gap:var(--space-2);height:var(--control-h)}
.divider{height:1px;background:var(--figma-color-border);border:0;margin:var(--space-2) 0}
/* ui-base v3 end */

/* audit-lite bespoke styles, laid out as the Lucide importer's window: a tab bar, a panel that scrolls, a footer that
   holds the panel's action (knowledge/ui/design/visual.md, *Quiet chrome*; knowledge/ui/patterns/settings.md;
   knowledge/ui/patterns/feedback.md, *Loading* and *Success confirmation*). */
[hidden]{display:none !important}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;font-size:12px}
.tabs{display:flex;flex:none;gap:2px;padding:8px 12px;border-bottom:1px solid var(--figma-color-border)}
.tab{height:auto;box-sizing:border-box;padding:6px 10px;border:0;border-radius:6px;background:none;color:var(--figma-color-text-secondary);font-size:12px;font-weight:var(--fw-regular)}
.tab[aria-selected=true]{background:var(--figma-color-bg-secondary);color:var(--figma-color-text);font-weight:var(--fw-semibold)}
.tab:hover:not([aria-selected=true]){background:var(--figma-color-bg-hover);color:var(--figma-color-text)}
.tab:focus{outline:none}
.tab:focus-visible{box-shadow:inset 0 0 0 2px var(--figma-color-border-selected)}
.panel{display:flex;flex:1;min-height:0;flex-direction:column}
.panel-body{flex:1;overflow-y:auto;padding:14px}
.footer{display:flex;flex:none;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--figma-color-border)}
.footer-hint{flex:1;min-width:0;color:var(--figma-color-text-secondary);font-size:11px;overflow-wrap:anywhere}
.footer button{width:auto}
.title{margin:0 0 4px;font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what{margin:0;color:var(--figma-color-text-secondary)}
/* aria-disabled, not disabled: the button keeps focus while the audit runs (knowledge/ui/patterns/actions.md) */
#run[aria-disabled="true"]{background:var(--figma-color-bg-disabled);color:var(--figma-color-text-ondisabled)}
#run:focus,#save:focus{outline:none}
#run:focus-visible,#save:focus-visible{outline:2px solid var(--figma-color-border-selected);outline-offset:2px}
.status{margin:14px 0 0}
.status-head{display:flex;align-items:flex-start;gap:8px}
.status-icon{flex:none;width:16px;height:16px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.status[data-tone="done"] .status-icon{stroke:var(--figma-color-icon-success)}
.status[data-tone="error"] .status-icon{stroke:var(--figma-color-icon-danger)}
.status-title{flex:1;min-width:0}
.status[data-tone="done"] .status-title{font-weight:var(--fw-semibold)}
.status[data-tone="error"] .status-title{color:var(--figma-color-text-danger)}
.status-detail{margin:0;color:var(--figma-color-text-secondary);overflow-wrap:anywhere}
.status[data-tone] .status-detail{padding-left:24px}
/* The scan is one call with no steps to count, so the bar is indeterminate. */
progress{display:block;width:100%;height:4px;margin:8px 0 0;border:0;border-radius:2px;overflow:hidden;
  appearance:none;-webkit-appearance:none;background:var(--figma-color-bg-tertiary)}
progress::-webkit-progress-bar{background:var(--figma-color-bg-tertiary)}
progress:indeterminate{background:linear-gradient(90deg,transparent 0 33%,var(--figma-color-bg-brand) 33% 66%,transparent 66%) 0 0/300% 100% var(--figma-color-bg-tertiary);animation:slide 1.2s linear infinite}
progress:indeterminate::-webkit-progress-bar{background:transparent}
@keyframes slide{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion: reduce){progress:indeterminate{animation:none;background:var(--figma-color-bg-brand)}}
/* settings: groups of label and control rows, as the Lucide importer's */
.settings-body{padding:12px 0}
.group+.group{margin-top:4px;padding-top:4px;border-top:1px solid var(--figma-color-border)}
.group-title{margin:0;padding:8px 14px 4px;font-size:12px;font-weight:700}
.field-row{display:flex;align-items:center;gap:10px;min-height:32px;padding:4px 14px}
.field-row>.label{flex:none;width:80px;color:var(--figma-color-text-secondary)}
.field-control{display:flex;flex:1;min-width:0;align-items:center;gap:10px}
.value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-btn{flex:none;height:auto;box-sizing:border-box;padding:0;border:0;background:none;color:var(--figma-color-text-brand);font-size:12px;font-weight:var(--fw-regular)}
.text-btn:hover{background:none;color:var(--figma-color-text-brand);text-decoration:underline}
.text-btn:focus{outline:none}
.text-btn:focus-visible{outline:2px solid var(--figma-color-border-selected);outline-offset:2px}
/* a switch: a native checkbox drawn as a track and a thumb (knowledge/ui/patterns/selection.md, *Switch*) */
.switch{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:24px;height:14px;margin:0;border-radius:7px;background:var(--figma-color-bg-tertiary);transition:background .12s}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--figma-color-bg);transition:transform .12s}
.switch:checked{background:var(--figma-color-bg-brand)}
.switch:checked::before{transform:translateX(10px)}
.switch:focus{outline:none}
.switch:focus-visible{outline:2px solid var(--figma-color-border-selected);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.switch,.switch::before{transition:none}}
</style>
</head>
<body>
<div class="tabs" role="tablist" aria-label="Audit lite"><button class="tab" role="tab" id="tab-audit" aria-controls="panel-audit" aria-selected="true" type="button">Audit</button><button class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1" type="button">Settings</button></div>

<div class="panel" id="panel-audit" role="tabpanel" aria-labelledby="tab-audit">
  <div class="panel-body">
    <p class="title" id="file">Reading the file…</p>
    <p class="what">Audits every component in this file and saves a report. Upload it to Claude and type <b>show me results</b>.</p>
    <div class="status" id="status" role="status" hidden>
      <div class="status-head">
        <svg class="status-icon" id="icon-done" viewBox="0 0 16 16" aria-hidden="true" hidden><circle cx="8" cy="8" r="6.75"/><path d="M5.25 8.25l1.75 1.75 3.75-4"/></svg>
        <svg class="status-icon" id="icon-error" viewBox="0 0 16 16" aria-hidden="true" hidden><circle cx="8" cy="8" r="6.75"/><path d="M8 4.75v3.75M8 11.25v.01"/></svg>
        <span class="status-title" id="status-title"></span>
      </div>
      <progress id="bar" hidden></progress>
      <p class="status-detail" id="status-detail" hidden></p>
    </div>
  </div>
  <div class="footer">
    <span class="footer-hint" id="version"></span>
    <button id="save" class="btn-secondary" type="button" hidden>Download</button>
    <button id="run" type="button">Run audit</button>
  </div>
</div>

<div class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
  <div class="panel-body settings-body">
    <section class="group" aria-labelledby="ctx-h">
      <h2 class="group-title" id="ctx-h">Context document</h2>
      <div class="field-row"><span class="label">Document</span>
        <div class="field-control"><span class="value" id="ctx-name">No document</span><button class="text-btn" id="ctx-pick" type="button">Upload…</button><button class="text-btn" id="ctx-clear" type="button" hidden>Remove</button></div></div>
      <div class="field-row" id="draft-row"><label class="label" for="draft">Create one</label>
        <div class="field-control"><span class="value secondary">With the next results</span><input type="checkbox" role="switch" class="switch" id="draft"></div></div>
    </section>
    <section class="group" aria-labelledby="rul-h">
      <h2 class="group-title" id="rul-h">Rulings</h2>
      <div class="field-row"><span class="label">Saved</span>
        <div class="field-control"><span class="value" id="rul-name">0</span><button class="text-btn" id="rul-upload" type="button">Upload…</button><button class="text-btn" id="rul-download" type="button" hidden>Download</button><button class="text-btn" id="rul-clear" type="button" hidden>Remove</button></div></div>
    </section>
  </div>
  <div class="footer"><span class="footer-hint" id="settings-hint" role="status">Rulings are saved in this file.</span></div>
</div>

<input type="file" id="ctx-file" accept=".md,text/markdown" hidden>
<input type="file" id="rul-file" accept=".md,text/markdown" hidden>

<script>
var $ = function (id) { return document.getElementById(id); };
var last = null, busy = false;
var HINT = 'Rulings are saved in this file.';
function tab(which) {
  ['audit', 'settings'].forEach(function (t) { var on = t === which; $('tab-' + t).setAttribute('aria-selected', String(on)); $('tab-' + t).tabIndex = on ? 0 : -1; $('panel-' + t).hidden = !on; });
}
$('tab-audit').onclick = function () { tab('audit'); };
$('tab-settings').onclick = function () { tab('settings'); };
document.querySelector('.tabs').onkeydown = function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { var to = $('tab-audit').getAttribute('aria-selected') === 'true' ? 'settings' : 'audit'; tab(to); $('tab-' + to).focus(); } };
function download(msg) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([msg.text], { type: 'text/markdown' }));
  a.download = msg.name; document.body.appendChild(a); a.click(); a.remove();
}
// tone: undefined while working, 'done' or 'error' after
function say(tone, title, detail) {
  var st = $('status'); st.hidden = false;
  if (tone) st.setAttribute('data-tone', tone); else st.removeAttribute('data-tone');
  // an svg has no `hidden` property, only the attribute
  $('icon-done').toggleAttribute('hidden', tone !== 'done'); $('icon-error').toggleAttribute('hidden', tone !== 'error');
  $('bar').hidden = !!tone;
  $('status-title').textContent = title;
  $('status-detail').textContent = detail || ''; $('status-detail').hidden = !detail;
}
// a settings change says what happened in the settings footer
function hint(text) { $('settings-hint').textContent = text || HINT; }
$('run').onclick = function () {
  if (busy) return;
  busy = true; $('run').setAttribute('aria-disabled', 'true');
  say(undefined, 'Auditing the components…', 'A large library takes about a minute.');
  parent.postMessage({ pluginMessage: { type: 'run', id: Date.now(), draft: $('draft').checked } }, '*');
};
parent.postMessage({ pluginMessage: { type: 'hello' } }, '*');
$('save').onclick = function () { if (last) download(last); };
// the project's context document: its settings and rulings, remembered for this file on this computer
function context(name) {
  $('ctx-name').textContent = name || 'No document';
  $('ctx-pick').textContent = name ? 'Change…' : 'Upload…';
  $('ctx-clear').hidden = !name;
  // a document in use needs no draft
  $('draft-row').hidden = !!name; if (name) $('draft').checked = false;
}
$('ctx-pick').onclick = function () { if (busy) return; $('ctx-file').value = ''; $('ctx-file').click(); };
$('ctx-clear').onclick = function () { if (busy) return; parent.postMessage({ pluginMessage: { type: 'context-clear' } }, '*'); };
// rulings downloaded from the results page: uploaded once, saved in the file, judged by on every run
function rulings(n) {
  $('rul-name').textContent = String(n || 0);
  $('rul-clear').hidden = $('rul-download').hidden = !n;
}
$('rul-upload').onclick = function () { if (busy) return; $('rul-file').value = ''; $('rul-file').click(); };
$('rul-clear').onclick = function () { if (!busy) parent.postMessage({ pluginMessage: { type: 'rulings-clear' } }, '*'); };
$('rul-download').onclick = function () { if (!busy) parent.postMessage({ pluginMessage: { type: 'rulings-download' } }, '*'); };
$('ctx-file').onchange = function () {
  var f = this.files && this.files[0]; if (!f || busy) return;
  f.text().then(function (text) { parent.postMessage({ pluginMessage: { type: 'context-set', name: f.name, text: text } }, '*'); });
};
$('rul-file').onchange = function () {
  var f = this.files && this.files[0]; if (!f || busy) return;
  f.text().then(function (text) { parent.postMessage({ pluginMessage: { type: 'rulings-add', text: text } }, '*'); });
};
onmessage = function (e) {
  var msg = e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'init') { $('file').textContent = msg.file; $('version').textContent = 'v' + msg.version; context(msg.context); rulings(msg.rulings); return; }
  if (msg.type === 'rulings') { rulings(msg.count); hint(msg.added == null ? '' : msg.added ? msg.added + (msg.added === 1 ? ' ruling' : ' rulings') + ' added. The next run judges by them.' : 'Rulings updated. The next run judges by them.'); return; }
  if (msg.type === 'file') { download(msg); return; }
  if (msg.type === 'rulings-failed') { hint('Rulings not changed: ' + msg.why + '.'); return; }
  if (msg.type === 'context') { context(msg.name); hint(''); return; }
  if (msg.type === 'context-failed') { hint('That document was not used: ' + msg.why + '.'); return; }
  busy = false; $('run').removeAttribute('aria-disabled');
  if (msg.type === 'done') {
    last = msg; download(msg); $('save').hidden = false;
    say('done', 'Saved ' + msg.name, msg.sets + ' components, ' + msg.found + ' possible issues for Claude to review' + (msg.from === 'context' ? ', judged by the context document' : '') + '. Upload the file and type "show me results".');
  } else if (msg.type === 'failed') {
    say('error', 'The audit stopped', msg.why + '. Press Run audit to try again.');
  }
};
</script>
</body>
</html>
